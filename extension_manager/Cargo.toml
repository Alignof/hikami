[package]
name = "extension_manager"
version = "0.1.0"
edition = "2024"

[features]
# Set by the root crate's `enable_extension` feature.
enable_extension = []

[lib]
proc-macro = true

[build-dependencies]
serde_json = "1.0.138"

[dependencies]
quote = "1.0.47"
syn = "3.0.10"
proc-macro2 = "1.0.107"
